# ig-autopost configuration.
# Nothing in src/ hardcodes these values.

border:
  canvas_w: 1080
  canvas_h: 1350          # 4:5 — sits exactly on Meta's aspect-ratio floor
  min_margin_px: 26       # measured from existing @snaps_by_sjoerd posts
  background: "#FFFFFF"
  jpeg_quality: 92
  max_bytes: 8388608      # 8 MB, Meta's hard limit for image containers

# Cosmetic only — drives the mock Instagram header in the curation app so the
# grid is previewed in context. Edit freely; nothing here reaches the Meta API.
profile:
  username: sjoerdvanrooijen
  display_name: Sjoerd
  bio: avonduren avonturen
  posts: 101              # null = count the files in photos/posted/
  followers: 859
  following: 762
  avatar: null            # path to a square image, relative to the repo root
  highlights: [savannah, mountains, oceans]

schedule:
  # Local wall-clock, not UTC: the target is a human attention window, and that
  # window doesn't move when the clocks do. Converted to UTC when read.
  timezone: Europe/Amsterdam
  # Posting times drift ± this many minutes. Deterministic per slot (hashed from
  # the slot itself), so the app and the publisher always agree — it just stops
  # every post landing on the same suspiciously exact minute.
  jitter_minutes: 25
  slots:
    # 0 = Monday. Wednesday late morning is the most consistently cited window
    # across published studies; Sunday morning is the leisure-scrolling one.
    - {weekday: 2, hour: 11, minute: 30}   # Wednesday
    - {weekday: 4, hour: 18, minute: 0}    # Friday, start of the evening
    - {weekday: 6, hour: 10, minute: 30}   # Sunday

publish:
  api_version: v26.0      # pinned; Meta retires versions on a ~2-year clock
  branch: main            # the branch raw.githubusercontent.com serves from
  poll_attempts: 20       # container processing is usually <5s, allow ~60s
  poll_seconds: 3
  todoist: true           # a "post is live" task; failure never rolls back a post
  # A Todoist task per upcoming post, due at its slot, so posting stays manual
  # but never gets forgotten. Rewritten on every Save.
  reminders: true
  reminder_count: 4       # only the next few — the queue can be a hundred deep

caption:
  # Suggestions only: the app offers three drafts per photo and never fills the
  # caption box by itself. Needs ANTHROPIC_API_KEY in .env; with the key absent
  # the button reports that and everything else keeps working.
  enabled: true
  model: "claude-opus-5"
  max_tokens: 2000
  effort: low              # three one-line captions; low keeps cost and latency down
  max_chars: 90            # style guard, not an API limit

paths:
  raw: photos/raw
  processed: photos/processed
  posted: photos/posted
  queue: queue.yaml
  # Backfilled from the Instagram API by `uv run python -m src.history`.
  # Display-only and git-ignored: these are already live on Instagram, so
  # committing ~100 copies would bloat the repo for no publishing benefit.
  history: photos/history
