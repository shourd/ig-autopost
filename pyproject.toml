[project]
name = "ig-autopost"
version = "0.1.0"
description = "Instagram publishing pipeline for @snaps_by_sjoerd"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "requests>=2.32",
]

[project.scripts]
app = "app.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
